<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #fbf5f4; --paper: #ffffff; --fg: #2b1418; --muted: #7b5a5f; --line: #ecd8da;
    --red: #b3132b; --leaf: #4d7a4a;
    --display: "Bodoni Moda", "Didot", "Times New Roman", serif;
    --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a0c10; --paper: #241318; --fg: #f8e9eb; --muted: #c3a2a7; --line: #3d2329; --red: #ec4a62; --leaf: #8fb686; color-scheme: dark; }
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .gate { min-height: 100%; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
  .card { width: 100%; max-width: 22rem; display: grid; gap: 1.1rem; justify-items: start; }
  .tulip { width: 54px; height: auto; }
  .tag { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tag b { color: var(--red); font-weight: 500; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: 1.05; margin: 0; }
  h1 em { color: var(--red); }
  p { margin: 0; color: var(--muted); }
  form { width: 100%; display: grid; gap: .75rem; }
  label { font-size: .9rem; font-weight: 500; color: var(--fg); }
  input[type=password] { width: 100%; font: inherit; font-family: var(--mono); font-size: 1.4rem; letter-spacing: .3em; padding: .8rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); }
  input[type=password]:focus { outline: 2px solid var(--red); outline-offset: 1px; border-color: var(--red); }
  .remember { display: flex; align-items: center; gap: .5rem; font-size: .9rem; color: var(--muted); }
  .remember input { accent-color: var(--red); width: 1.1rem; height: 1.1rem; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: .9rem 1.4rem; background: var(--red); color: var(--paper); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .msg { min-height: 1.4em; font-size: .9rem; color: var(--red); }
  .hint { font-size: .9rem; }
  @media (prefers-reduced-motion: no-preference) { .shake { animation: shake .35s; } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
</style>
</head>

<main class="gate">
  <div class="card" id="card">
    <svg class="tulip" viewBox="0 0 64 96" aria-hidden="true">
      <path d="M32 44 C32 60 32 76 32 94" stroke="var(--leaf)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M32 80 C22 76 14 66 13 54 C24 58 30 66 32 80 Z" fill="var(--leaf)"/>
      <path d="M32 72 C40 68 48 60 50 50 C41 53 34 60 32 72 Z" fill="var(--leaf)" opacity=".85"/>
      <path d="M16 18 C16 34 22 46 32 46 C42 46 48 34 48 18 C42 24 38 22 32 10 C26 22 22 24 16 18 Z" fill="var(--red)"/>
    </svg>
    <span class="tag">Caso nº <b>07.11.2025</b> · acesso restrito</span>
    <h1>Arquivo <em>confidencial</em></h1>
    <p>Só uma pessoa tem a senha deste caso.</p>
    <form id="form" autocomplete="off">
      <label for="senha">Senha</label>
      <input id="senha" type="password" inputmode="numeric" autocomplete="current-password" required>
      
      <label class="remember" for="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
      <button id="entrar" type="submit">Abrir o arquivo</button>
      <span class="msg" id="msg" role="alert"></span>
    </form>
  </div>
</main>

  const CHAVE = "npa-senha";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function abrir(senha) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
    const chave = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(DADOS.salt), iterations: DADOS.it, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DADOS.iv) }, chave, b64(DADOS.ct));
    return [new TextDecoder().decode(claro), chave];
  }

  function mostrar(pagina, chave) {
    window.__npaKey = chave;
    const doc = new DOMParser().parseFromString(pagina, "text/html");
    document.title = doc.title;
    document.head.replaceChildren(...[...doc.head.childNodes].map((n) => document.importNode(n, true)));
    document.body.replaceChildren(...[...doc.body.childNodes].map((n) => document.importNode(n, true)));
    document.querySelectorAll("script").forEach((velho) => {
      const novo = document.createElement("script");
      novo.textContent = velho.textContent;
      velho.replaceWith(novo);
    });
  }

  const form = document.getElementById("form");
  const campo = document.getElementById("senha");
  const botao = document.getElementById("entrar");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    botao.disabled = true; botao.textContent = "Abrindo…"; msg.textContent = "";
    try {
      const [pagina, chave] = await abrir(campo.value);
      try {
        if (document.getElementById("lembrar").checked) localStorage.setItem(CHAVE, campo.value);
        else localStorage.removeItem(CHAVE);
      } catch (_) {}
      mostrar(pagina, chave);
    } catch (_) {
      botao.disabled = false; botao.textContent = "Abrir o arquivo";
      msg.textContent = "Senha incorreta. Tente de novo.";
      const card = document.getElementById("card");
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      campo.select();
    }
  });

  (async () => {
    let salva = null;
    try { salva = localStorage.getItem(CHAVE); } catch (_) {}
    if (!salva) { campo.focus(); return; }
    try { const [pagina, chave] = await abrir(salva); mostrar(pagina, chave); }
    catch (_) { try { localStorage.removeItem(CHAVE); } catch (_) {} campo.focus(); }
  })();
</script>
